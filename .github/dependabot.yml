version: 2
updates:
  # Monthly updates for regular dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 3
    reviewers:
      - 'aftongauntlett'
    assignees:
      - 'aftongauntlett'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    # Only open PRs for dependencies declared directly in package.json —
    # transitive-only bumps (e.g. a sub-dependency's sub-dependency) get
    # pulled in automatically whenever a direct dependency updates instead
    # of spawning their own PRs.
    allow:
      - dependency-type: 'direct'
    # Group related dependencies to reduce PR noise. update-types is set
    # explicitly on every group because the top-level `ignore` below does
    # NOT reliably apply to grouped updates (a known Dependabot gap) —
    # this is what let the vite 7->8 major bump through as its own PR.
    groups:
      development-dependencies:
        update-types: ['minor', 'patch']
        patterns:
          - '@types/*'
          - '@typescript-eslint/*'
          - 'eslint*'
          - 'vitest'
          - 'vite*'
          - '@vitejs/*'
          - 'prettier'
          - 'tailwindcss'
          - 'postcss'
          - 'autoprefixer'
      react-ecosystem:
        update-types: ['minor', 'patch']
        patterns:
          - 'react*'
          - '@testing-library/*'
      build-tools:
        update-types: ['minor', 'patch']
        patterns:
          - 'typescript'
          - 'rollup*'
      production-dependencies:
        update-types: ['minor', 'patch']
        patterns:
          - '*'
        exclude-patterns:
          - '@types/*'
          - '@typescript-eslint/*'
          - 'eslint*'
          - 'vitest'
          - 'vite*'
          - '@vitejs/*'
          - 'prettier'
          - 'tailwindcss'
          - 'postcss'
          - 'autoprefixer'
          - 'react*'
          - '@testing-library/*'
          - 'typescript'
          - 'rollup*'
    # Belt-and-suspenders: block major bumps for anything that somehow
    # falls outside every group above.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
